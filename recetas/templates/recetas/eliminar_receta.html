{% extends 'recetas/base.html' %}
{% block title %}Eliminar receta{% endblock %}

{% block content %}
<h2>Eliminar receta</h2>
<p>¿Seguro que quieres eliminar "{{ object.titulo }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'detalles_receta' object.pk %}">Cancelar</a>
{% endblock %}
